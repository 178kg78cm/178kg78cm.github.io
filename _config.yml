# Site settings
title: 조현호 임베디드 블로그
subtile : 256
email: jhh7550@gmail.com
author: 178kg78cm
locale: ko_KR
tagline: 임베디드 소프트웨어 포트폴리오

# Copyright setting
# You can use any html code, currently below placeholders are available:
# * current year: {currentYear}
# * author: {author} (Value is the same as site.author)
# * copyright: (c) - ©
# * copyleft: (cleft)
# * sound recording copyright: (p) - ℗
#
# For example:
#   "Copyright (c) 2017-{currentYear} <a href="https://example.com">{author}</a>"
#   "Copyright © 2017-2021 Foobar"
#
copyright: "Unpublished Work (cleft) 2021-{currentYear} {author}"

description: >- # this means to ignore newlines until "baseurl:"
  임베디드 소프트웨어를 공부하는 조현호의 기술 블로그. MCU, RTOS, AUTOSAR,
  CAN·차량용 이더넷, 자동차 SW 개발 프로세스(A-SPICE, ISO 26262)와 알고리즘을 정리합니다.

url: "https://178kg78cm.github.io"
baseurl: ""
favicon: "" # the favicon for your site
permalink: /:year-:month-:day-:title/

# Date format (https://shopify.github.io/liquid/filters/date/)
yat:
  date_format: "%b %d, %Y"

# If you want more debug log, you can set true
# debug: false

# If you don't want transparent header, you can set false
# header_transparent: true

# If you want to change the content width, you can set to another value
# content_width: "920px"

# Google analytics - GA4
google_analytics: "G-V856LMYX0W"
enableDNT: "false"

# If you want to generate website sitemap, you can set true
sitemap: true

# If you want to change site language, you can set lang option
lang: "ko"  # default lang is en

