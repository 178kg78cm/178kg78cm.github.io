# Site settings
title: 조현호 임베디드 블로그
subtile : 256 # 178kg78cm → 178 + 78 = 256 = 2^8
email: jhh7550@gmail.com
author: 178kg78cm
locale: ko_KR
tagline: 임베디드 소프트웨어 포트폴리오

# Placeholders: {currentYear}, {author}, (c) → ©
copyright: "Copyright (c) 2023-{currentYear} {author}"

description: >- # this means to ignore newlines until "baseurl:"
  임베디드 소프트웨어를 공부하는 조현호의 기술 블로그. MCU, RTOS, AUTOSAR,
  CAN·차량용 이더넷, 자동차 SW 개발 프로세스(A-SPICE, ISO 26262)와 알고리즘을 정리합니다.

url: "https://178kg78cm.github.io"
baseurl: ""
favicon: "/assets/images/favicon.svg"
permalink: /:year-:month-:day-:title/

# Date format (https://shopify.github.io/liquid/filters/date/)
yat:
  date_format: "%Y.%m.%d"

# Google analytics - GA4
google_analytics: "G-V856LMYX0W"
enableDNT: "false"

sitemap: true
lang: "ko"

# Theme
theme_color: "#0a0a0b"
brand_color: "#e8e05a"

# Night mode: "auto" (19:00-07:00), "manual", "on", "off"
night_mode: "on"

code_badge:
  enabled: "true"
  color: "#fff"
  background_color: "#ff4e00"
  text_transform: "uppercase"  # ("uppercase", "lowercase", "capitalize")

# Header navigation (portfolio sections + blog pages)
nav:
  - title: About
    url: /#about
  - title: Projects
    url: /#projects
  - title: Blog
    url: /blog/
  - title: Categories
    url: /categories/
  - title: Tags
    url: /tags/

# Pages that should not appear in sitemap.xml
defaults:
  - scope:
      path: "404.html"
    values:
      sitemap: false
  - scope:
      path: "googleeec36f26a34d142b.html"
    values:
      sitemap: false
  - scope:
      path: "navera5d48520962eb20a438ab549aed491c7.html"
    values:
      sitemap: false

excerpt_size: 200

# Utterances comments (https://utteranc.es/)
utterances:
  repo: "178kg78cm/comments"
  issue_term: "title"
  label: "utterances comment"
  theme: "github-dark"
  follow_site_theme: true

# Build settings
highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

# Files that are not part of the site
exclude:
  - README.md
  - WRITING.md
  - tree.txt
  - Gemfile
  - Gemfile.lock
  - .vscode
